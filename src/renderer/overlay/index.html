<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
    <link rel="stylesheet" href="overlay.css" />
  </head>
  <body>
    <div class="panel">
      <header class="bar">
        <span class="dot" id="dot"></span>
        <span class="label" id="status">idle</span>
        <span class="grow"></span>
        <button id="listen" title="Start / stop listening (⌘⇧L)">listen</button>
        <button id="shot" title="Capture a screenshot — adds a preview, press ↵ to send">📷</button>
        <button id="clear" title="Clear (⌘⇧R)">clear</button>
        <button id="settings" title="Settings">⚙</button>
        <button id="hide" title="Hide overlay (⌘⇧H)">×</button>
      </header>

      <div class="transcript-wrap">
        <div class="transcript" id="transcript"></div>
        <div class="live" id="caption"></div>
      </div>
      <div class="answer" id="answer">
        <p class="hint">Waiting for a question…</p>
      </div>
      <div class="actions" id="actions" hidden>
        <button id="micSettings">Open microphone settings</button>
        <button id="screenSettings">Open screen recording settings</button>
      </div>
      <div class="shots" id="shots" hidden></div>
      <div class="composer">
        <textarea
          id="prompt"
          rows="1"
          autocomplete="off"
          placeholder="Type a question or prompt — ⏎ to send, ⇧⏎ for a new line"
        ></textarea>
        <button id="send" title="Send (⏎)">↵</button>
      </div>
      <footer class="foot"><span id="meta"></span></footer>
    </div>
    <div class="lightbox" id="lightbox" hidden>
      <img id="lightboxImg" alt="Screenshot preview" />
      <button id="lightboxClose" title="Close preview (Esc)">×</button>
    </div>
    <script src="render.js"></script>
    <script src="overlay.js"></script>
  </body>
</html>
