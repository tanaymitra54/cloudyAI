<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
    <link rel="stylesheet" href="overlay.css" />
  </head>
  <body>
    <div class="panel">
      <header class="bar">
        <span class="dot" id="dot"></span>
        <span class="label" id="status">idle</span>
        <span class="grow"></span>
        <button id="listen" title="Start / stop listening (⌘⇧L)">listen</button>
        <button id="shot" title="Screenshot of the active screen — queues a preview (⌘⇧S)">📷</button>
        <button id="clear" title="Clear conversation (⌘⇧R)">clear</button>
        <button id="settings" title="Settings">⚙</button>
        <button id="hide" title="Hide overlay (⌘⇧A)">×</button>
      </header>

      <div class="panes">
        <!-- Left: the live conversation, chat-style. The other side is on the
             left, you are on the right, exactly like a messaging app. -->
        <section class="convo">
          <div class="pane-head">
            <span>Live conversation</span>
            <span class="legend"><i class="sw them"></i>them <i class="sw me"></i>you</span>
          </div>
          <div class="transcript" id="transcript"></div>
          <div class="live" id="caption" hidden></div>
        </section>

        <!-- Right: the answer to the question that was just detected. -->
        <section class="answers">
          <div class="pane-head">
            <span>Answer</span>
            <span class="legend" id="answerFor"></span>
          </div>
          <div class="answer" id="answer">
            <p class="hint">Waiting for a question…</p>
          </div>
          <div class="actions" id="actions" hidden>
            <button id="micSettings">Open microphone settings</button>
            <button id="screenSettings">Open screen recording settings</button>
          </div>
          <div class="shots" id="shots" hidden></div>
          <div class="composer">
            <textarea
              id="prompt"
              rows="1"
              autocomplete="off"
              placeholder="Type a question — ⏎ or ⌘↵ to send (⌘⇧S for a screenshot)"
            ></textarea>
            <button id="send" title="Send text + screenshots (⌘↵)">↵</button>
          </div>
        </section>
      </div>

      <footer class="foot"><span id="meta"></span></footer>
    </div>
    <div class="lightbox" id="lightbox" hidden>
      <img id="lightboxImg" alt="Screenshot preview" />
      <button id="lightboxClose" title="Close preview (Esc)">×</button>
    </div>
    <script src="render.js"></script>
    <script src="overlay.js"></script>
  </body>
</html>
